<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Contact</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="D10.css">

</head>
<body>

<section class="contact" id="contact">

<div class="container">

<h2>Contact Me</h2>

<p class="subtitle">
Let's work together! Feel free to contact me anytime.
</p>

<div class="contact-wrapper">

<!-- LEFT -->

<div class="contact-info">

<h3>Get In Touch</h3>

<p>
I am always open to discussing new opportunities,
creative ideas and exciting projects.
</p>

<div class="info">

<div>
<i class="fas fa-user"></i>
<span>Ritik Malik</span>
</div>

<div>
<i class="fas fa-envelope"></i>
<span>ritikmalik999@gmail.com</span>
</div>

<div>
<i class="fas fa-phone"></i>
<span>+91 9876543210</span>
</div>

<div>
<i class="fas fa-location-dot"></i>
<span>Muzaffarnagar, Uttar Pradesh</span>
</div>

</div>

<h3>Follow Me</h3>

<div class="social">

<a href="https://github.com/" target="_blank">
<i class="fab fa-github"></i>
</a>

<a href="https://linkedin.com/" target="_blank">
<i class="fab fa-linkedin"></i>
</a>

<a href="https://twitter.com/" target="_blank">
<i class="fab fa-x-twitter"></i>
</a>

<a href="https://instagram.com/" target="_blank">
<i class="fab fa-instagram"></i>
</a>

</div>

</div>

<!-- RIGHT -->

<div class="contact-form">

<form id="contactForm">

<div class="input-box">

<input
type="text"
id="name"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="text"
id="phone"
placeholder="Mobile Number"
required>

</div>

<div class="input-box">

<input
type="text"
id="subject"
placeholder="Subject"
required>

</div>

<div class="input-box">

<textarea
id="message"
rows="6"
placeholder="Write your message..."
required>
</textarea>

</div>

<button type="submit">
Send Message
</button>

<p id="success"></p>

</form>

</div>

</div>

</div>

</section>

<section class="map">

<iframe
src="https://www.google.com/maps?q=Muzaffarnagar&output=embed"
loading="lazy">
</iframe>

</section>

<script src="D10.js"></script>

</body>
</html>
